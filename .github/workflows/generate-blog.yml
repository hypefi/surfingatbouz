name: Generate weekly blog post

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate:blog

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          if git diff --staged --quiet; then
            echo "No new post generated"
            exit 0
          fi
          SLUG=$(git diff --staged --name-only -- 'content/blog/*.md' | head -1 | xargs -n1 basename | sed 's/\.md$//')
          git commit -m "content: add blog post ${SLUG:-weekly}"
          git push
